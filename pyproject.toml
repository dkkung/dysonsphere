[project]
name = "dysonsphere"
dynamic = ["version"]
description = "An Altair theme and chart utility library for publication-ready scientific figures."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "dkkung", email = "128324842+dkkung@users.noreply.github.com" }]
keywords = ["altair", "vega-lite", "visualization", "data visualization", "colormap", "palette", "theme"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Visualization",
    "Development Status :: 4 - Beta",
    "Operating System :: OS Independent",
]
requires-python = ">=3.11"
dependencies = [
    "altair>=6.0.0",
    "numpy>=1.26.0",
    "pillow>=10.0.0",
    "polars[pyarrow]>=1.19.0",
    "scipy>=1.11.0",
    "vl-convert-python>=1.9.0",
]

[dependency-groups]
dev = [
    "duckdb>=1.0.0",
    "ipython>=8.0.0",
    "pandas>=2.0.0",
    "pytest>=9.0.0",
    "ruff>=0.15.17",
    "ty>=0.0.0",
    "dysonsphere-biology",
]

[tool.uv.workspace]
members = ["dysonsphere-biology"]

[tool.uv.sources]
dysonsphere-biology = { workspace = true }

[project.urls]
Repository = "https://github.com/dkkung/dysonsphere"

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.targets.wheel]
packages = ["src/dysonsphere"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.ruff.lint.per-file-ignores]
"src/dysonsphere/__init__.py" = ["F405"]

[tool.ruff.format]
quote-style = "double"

[tool.ty.rules]
missing-type-argument = "error"

[tool.ty.src]
exclude = ["website"]
